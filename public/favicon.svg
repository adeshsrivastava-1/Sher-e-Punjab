<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE074"/>
      <stop offset="50%" stop-color="#E5982A"/>
      <stop offset="100%" stop-color="#9C5F10"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C23B22"/>
      <stop offset="100%" stop-color="#7B1A0B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="14" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="#FCE074" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  
  <!-- Stylized Royal Punjab Lion Crown Silhouette -->
  <g transform="translate(0, 5)" fill="url(#goldGrad)">
    <!-- Crown / Sunburst Peaks -->
    <path d="M256 95 L272 135 L310 115 L292 155 L335 150 L308 180 L345 200 L305 215 L320 250 L280 235 L275 270 L256 240 L237 270 L232 235 L192 250 L207 215 L167 200 L204 180 L177 150 L220 155 L202 115 L240 135 Z" opacity="0.95"/>
    
    <!-- Lion Face Silhouette -->
    <path d="M256 160 C220 160 190 190 190 230 C190 270 215 310 240 335 C248 343 252 350 256 358 C260 350 264 343 272 335 C297 310 322 270 322 230 C322 190 292 160 256 160 Z M256 320 C242 300 218 268 218 232 C218 208 235 186 256 186 C277 186 294 208 294 232 C294 268 270 300 256 320 Z"/>
    
    <!-- Eyes -->
    <ellipse cx="232" cy="225" rx="8" ry="5" fill="#7B1A0B"/>
    <ellipse cx="280" cy="225" rx="8" ry="5" fill="#7B1A0B"/>
    
    <!-- Nose & Mustache Flame -->
    <path d="M256 240 L248 255 L264 255 Z" fill="#7B1A0B"/>
    <path d="M256 260 C240 260 230 270 220 272 C235 278 248 274 256 266 C264 274 277 278 292 272 C282 270 272 260 256 260 Z" fill="#7B1A0B"/>
    
    <!-- Lion Mane Waves -->
    <path d="M170 260 Q150 290 180 320 Q160 340 195 350 Q180 375 220 385 L256 410 L292 385 Q332 375 317 350 Q352 340 332 320 Q362 290 342 260 Q325 295 295 320 Q280 345 256 345 Q232 345 217 320 Q187 295 170 260 Z" opacity="0.9"/>
  </g>
  
  <!-- Text Arch Bottom -->
  <path id="textArc" d="M 90 350 A 200 200 0 0 0 422 350" fill="none"/>
  <text font-family="'Cormorant Garamond', 'Georgia', serif" font-weight="700" font-size="34" fill="#FFFDF9" letter-spacing="3" text-anchor="middle">
    <textPath href="#textArc" startOffset="50%">SHER E PUNJAB</textPath>
  </text>
</svg>
